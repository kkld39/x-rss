name: Update X RSS

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: x-rss-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check application
        run: python -m unittest discover -s tests -v
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v5
      - name: Fetch X and build RSS
        id: update
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m xrss.app
      - name: Save history and generated feeds
        if: steps.update.outputs.ready == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data public
          if ! git diff --cached --quiet; then
            git commit -m 'Update X RSS history and feeds [skip ci]'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Package site
        if: success() && steps.update.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1
      - name: Deploy Pages
        if: success() && steps.update.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Fail workflow when fetching failed for every account
        if: always() && steps.update.outcome == 'failure'
        run: |
          echo 'X retrieval failed. See Fetch X and build RSS and the job summary.'
          exit 1
