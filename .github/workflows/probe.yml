name: Probe X connectivity
on:
  workflow_dispatch:
    inputs:
      confirm_network:
        description: 'Xへ追加アクセスします。通常運用では実行不要です。'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probe:
    if: inputs.confirm_network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test direct unauthenticated X access from this runner
        run: python -m xrss.probe
