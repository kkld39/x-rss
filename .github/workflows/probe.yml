name: Probe X connectivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe.yml'
      - 'xrss/source.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test direct unauthenticated X access from this runner
        run: python -m xrss.probe
