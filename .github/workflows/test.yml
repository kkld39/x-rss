name: Tests
on:
  push:
    paths:
      - 'xrss/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'accounts.yml'
      - '.github/workflows/**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "from pathlib import Path; from xrss.config import load_config; load_config(Path('accounts.yml'))"
